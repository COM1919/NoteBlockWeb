<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Render Test V2</title></head>
<body>
<div id="result">RUNNING...</div>
<script src="/static/js/render_jsmix.js?v=20260906e"></script>
<script src="/static/js/audio_render.js?v=20260906f"></script>
<script>
(function() {
    'use strict';
    var out = document.getElementById('result');
    function log(s) { out.innerHTML += (out.innerHTML === 'RUNNING...' ? '' : '<br>') + s; }

    var sharedDecoded = null;   // 已解码的 harp buffer
    var decodeError = null;
    window.__RENDER_LOGS = [];

    function dumpLogs(tag) {
        if (window.__RENDER_LOGS && window.__RENDER_LOGS.length) {
            log(tag + ' RENDER_LOGS:');
            for (var i = 0; i < window.__RENDER_LOGS.length; i++) {
                log(tag + '  ' + window.__RENDER_LOGS[i]);
            }
        }
    }

    function dumpRS(tag) {
        var a = window.__RS_DBG;
        if (a && a.length) {
            log(tag + ' RS_DBG:');
            for (var i = 0; i < a.length; i++) log(tag + '  ' + a[i]);
        }
    }

    function computePeak(buf) {
        var ch = buf.getChannelData(0);
        var max = 0, sum = 0, nonzero = 0;
        for (var i = 0; i < ch.length; i++) {
            var v = Math.abs(ch[i]);
            if (v > max) max = v;
            sum += v;
            if (v > 0.0001) nonzero++;
        }
        return { max: max, avg: sum / ch.length, nonzero: nonzero, len: ch.length };
    }

    async function tryDecode() {
        try {
            var resp = await fetch('/static/sounds/harp.ogg');
            var ab = await resp.arrayBuffer();
            var dctx = new AudioContext();
            log('[T] AudioContext.state = ' + dctx.state);
            var buf = await new Promise(function(ok, no) { dctx.decodeAudioData(ab, ok, no); });
            log('[T] decode OK, dur=' + buf.duration.toFixed(3) + 's ch=' + buf.numberOfChannels);
            return buf;
        } catch (e) {
            log('[T] decode FAILED: ' + e.message);
            decodeError = e.message;
            return null;
        }
    }

    async function baseline(octx) {
        // 直接调度一个源到 OfflineAudioContext 播放已解码 buffer, 验证 OAC 本身可发声
        if (!sharedDecoded) return;
        var src = octx.createBufferSource();
        src.buffer = sharedDecoded;
        src.playbackRate.value = 1;
        var g = octx.createGain();
        g.gain.value = 0.7;
        src.connect(g);
        g.connect(octx.destination);
        src.start(0);
        src.stop(0.4);
    }

    async function run() {
        try {
            sharedDecoded = await tryDecode();
            if (!sharedDecoded) { log('测试中止'); return; }

            // ===== A. 基线: 裸 OfflineAudioContext 直接放 buffer =====
            var lenA = Math.ceil(1.0 * 44100);
            var octx = new OfflineAudioContext(2, lenA, 44100);
            await baseline(octx);
            var rA = await octx.startRendering();
            var pA = computePeak(rA);
            log('[A] 裸调度峰值: ' + pA.max.toFixed(6) + ' nonzero=' + pA.nonzero + (pA.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== B. 模拟"实时引擎已预加载" (getSoundBuffer 返回共享解码 buffer) =====
            window.AudioEngine = {
                getSoundBuffer: function() { return sharedDecoded; },
                getContext: function() { return null; }
            };
            var notesB = [];
            for (var i = 0; i < 8; i++) {
                notesB.push({ tick: i * 5, layer: 0, instrument: 0, key: 45 + i, velocity: 100, pan: 50, pitch: 0 });
            }
            window.__RS_DBG = [];
            var rB = await AudioRender.renderSong({
                notes: notesB, tempo: 20,
                layers: [{ volume: 100, lock: 0 }],
                style: 'dry', customInstruments: {},
                onProgress: function(l, p) { log('[B] progress: ' + (l || '') + ' ' + p); }
            });
            var pB = computePeak(rB);
            log('[B] renderSong(getSoundBuffer已缓存) 峰值: ' + pB.max.toFixed(6) + ' nonzero=' + pB.nonzero + (pB.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));
            dumpLogs('[B]');
            dumpRS('[B]');

            // ===== C. 模拟"无缓存" (getSoundBuffer 返回 null, 走 getDefaultBuffer) =====
            window.AudioEngine = {
                getSoundBuffer: function() { return null; },
                getContext: function() { return null; }
            };
            var rC = await AudioRender.renderSong({
                notes: notesB, tempo: 20,
                layers: [{ volume: 100, lock: 0 }],
                style: 'dry', customInstruments: {},
                onProgress: function(l, p) { log('[C] progress: ' + (l || '') + ' ' + p); }
            });
            var pC = computePeak(rC);
            log('[C] renderSong(getDefaultBuffer路径) 峰值: ' + pC.max.toFixed(6) + ' nonzero=' + pC.nonzero + (pC.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));
            dumpLogs('[C]');

            // ===== B2. renderSong 但不传 onProgress =====
            window.AudioEngine = {
                getSoundBuffer: function() { return sharedDecoded; },
                getContext: function() { return null; }
            };
            var rB2 = await AudioRender.renderSong({
                notes: notesB, tempo: 20,
                layers: [{ volume: 100, lock: 0 }],
                style: 'dry', customInstruments: {}
            });
            var pB2 = computePeak(rB2);
            log('[B2] renderSong(无onProgress) 峰值: ' + pB2.max.toFixed(6) + ' nonzero=' + pB2.nonzero + (pB2.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== B3. renderSong 最小 opts (无layers/solo) =====
            var rB3 = await AudioRender.renderSong({
                notes: notesB, tempo: 20,
                style: 'dry', customInstruments: {}
            });
            var pB3 = computePeak(rB3);
            log('[B3] renderSong(最小opts) 峰值: ' + pB3.max.toFixed(6) + ' nonzero=' + pB3.nonzero + (pB3.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));
            dumpLogs('[B3]');

            // ===== B4. renderSong 但禁掉诊断日志 (__RENDER_LOGS=null) =====
            var savedLogs = window.__RENDER_LOGS;
            window.__RENDER_LOGS = null;
            var rB4 = await AudioRender.renderSong({
                notes: notesB, tempo: 20,
                layers: [{ volume: 100, lock: 0 }],
                style: 'dry', customInstruments: {},
                onProgress: null
            });
            window.__RENDER_LOGS = savedLogs;
            var pB4 = computePeak(rB4);
            log('[B4] renderSong(禁diag) 峰值: ' + pB4.max.toFixed(6) + ' nonzero=' + pB4.nonzero + (pB4.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== S1. 把 scheduleTask 原样拷贝进页面, 驱动同样的音符与链 =====
            try {
                var lenS = Math.ceil(2.3 * 44100);
                var octxS = new OfflineAudioContext(2, lenS, 44100);
                var chainS = AudioRender.buildChain(octxS, 'dry', octxS.destination);
                var busS = chainS.input;
                var sortedS = notesB.slice().sort(function(a, b) { return a.tick - b.tick; });
                var tempoS = 20;
                var layerVolS = { 0: 100 };
                var customMetaS = {};
                var scheduleTaskCopy = function(n) {
                    var layerIdx = n.layer || 0;
                    var volS = (layerVolS[layerIdx] !== undefined ? layerVolS[layerIdx] : 100) / 100;
                    var velocityS = (n.velocity === undefined || n.velocity === null) ? 100 : n.velocity;
                    if (velocityS <= 0 || volS <= 0) return null;
                    var instS = n.instrument;
                    var bufferPS = null;
                    var baseRateS = 1;
                    var smGainS = 0.70;
                    if (instS >= 20) {
                        var customS = customMetaS[instS];
                        if (!customS || !customS.buffer) return null;
                        bufferPS = Promise.resolve(customS.buffer);
                        smGainS = (typeof customS.gain === 'number' ? customS.gain : 100) / 100 * 0.7;
                        var baseKeyS = (typeof customS.baseKey === 'number') ? customS.baseKey : 33;
                        baseRateS = AudioRender.pitchRate(n.key) / AudioRender.pitchRate(baseKeyS);
                    } else {
                        bufferPS = Promise.resolve(sharedDecoded);
                        smGainS = 0.70;
                        baseRateS = AudioRender.pitchRate(n.key);
                    }
                    var centsS = n.pitch || 0;
                    var rateS = baseRateS * Math.pow(2, centsS / 1200);
                    var startTimeS = (n.tick / tempoS);
                    var gainS = smGainS * (velocityS / 100) * volS;
                    return bufferPS.then(function(bufferS) {
                        if (!bufferS) return;
                        var srcS = octxS.createBufferSource();
                        srcS.buffer = bufferS;
                        srcS.playbackRate.value = Math.max(0.02, Math.min(8, rateS));
                        var gNodeS = octxS.createGain();
                        gNodeS.gain.setValueAtTime(0.0001, startTimeS);
                        gNodeS.gain.exponentialRampToValueAtTime(Math.max(0.001, gainS), startTimeS + 0.005);
                        var panValS = (typeof n.pan === 'number') ? n.pan : 50;
                        var outS = gNodeS;
                        if (octxS.createStereoPanner) {
                            var pannerS = octxS.createStereoPanner();
                            pannerS.pan.value = (panValS - 50) / 50;
                            gNodeS.connect(pannerS);
                            outS = pannerS;
                        }
                        outS.connect(busS);
                        var durS = Math.max(0.01, bufferS.duration / Math.max(0.5, rateS));
                        srcS.start(startTimeS);
                        try { srcS.stop(startTimeS + durS + 0.03); } catch (e) {}
                        return true;
                    }).catch(function() { return null; });
                };
                var seqS = Promise.resolve();
                for (var iS = 0; iS < sortedS.length; iS++) {
                    (function(n) {
                        seqS = seqS.then(function() { return scheduleTaskCopy(n); });
                    })(sortedS[iS]);
                }
                var rS = await seqS.then(function() { return octxS.startRendering(); });
                var pS = computePeak(rS);
                log('[S1] scheduleTask拷贝 峰值: ' + pS.max.toFixed(6) + ' nonzero=' + pS.nonzero + (pS.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));
            } catch (e) { log('[S1] ERROR: ' + e.message); }

            // ===== S2. 同 S1 但去掉嵌套 Promise 层 (构建直接放在 seq 回调里) =====
            try {
                var octxS2 = new OfflineAudioContext(2, Math.ceil(2.3 * 44100), 44100);
                var chainS2 = AudioRender.buildChain(octxS2, 'dry', octxS2.destination);
                var sortedS2 = notesB.slice().sort(function(a, b) { return a.tick - b.tick; });
                var seqS2 = Promise.resolve(sharedDecoded);
                for (var iS2 = 0; iS2 < sortedS2.length; iS2++) {
                    (function(n) {
                        seqS2 = seqS2.then(function(bufX) {
                            var velocityX = (n.velocity === undefined || n.velocity === null) ? 100 : n.velocity;
                            var startTX = (n.tick / 20);
                            var rateX = Math.max(0.02, Math.min(8, AudioRender.pitchRate(n.key) * Math.pow(2, (n.pitch || 0) / 1200)));
                            var srcX = octxS2.createBufferSource();
                            srcX.buffer = bufX;
                            srcX.playbackRate.value = rateX;
                            var gX = octxS2.createGain();
                            gX.gain.setValueAtTime(0.0001, startTX);
                            gX.gain.exponentialRampToValueAtTime(Math.max(0.001, 0.70 * (velocityX / 100)), startTX + 0.005);
                            srcX.connect(gX);
                            var panX = (typeof n.pan === 'number') ? n.pan : 50;
                            var pX2 = octxS2.createStereoPanner();
                            pX2.pan.value = (panX - 50) / 50;
                            gX.connect(pX2);
                            pX2.connect(chainS2.input);
                            srcX.start(startTX);
                            srcX.stop(startTX + bufX.duration + 0.03);
                            return bufX;
                        });
                    })(sortedS2[iS2]);
                }
                var rS2 = await seqS2.then(function() { return octxS2.startRendering(); });
                var pS2 = computePeak(rS2);
                log('[S2] scheduleTask无嵌套Promise层 峰值: ' + pS2.max.toFixed(6) + ' nonzero=' + pS2.nonzero + (pS2.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));
            } catch (e) { log('[S2] ERROR: ' + e.message); }

            // ===== R1. 完整复刻 renderSong 前奏(AC/probe/length/offCtx/chain/masterBus) + H式调度器 =====
            try {
                var n8 = notesB;
                var tempoR = 20;
                var maxTickR = 0;
                for (var iR0 = 0; iR0 < n8.length; iR0++) { var tR = n8[iR0].tick; if (tR > maxTickR) maxTickR = tR; }
                var totalR = (maxTickR + 1) / tempoR + 0.5;
                var AC2 = window.AudioContext || window.webkitAudioContext;
                var dctxR = null; try { dctxR = new AC2(); } catch (e) {}
                var srR;
                try { var probeR = new OfflineAudioContext(1, 1, 44100); srR = probeR.sampleRate; } catch (e) { srR = 44100; }
                var lenR = Math.max(1, Math.ceil(totalR * srR));
                var octxR = new OfflineAudioContext(2, lenR, srR);
                var chainR = AudioRender.buildChain(octxR, 'dry', octxR.destination);
                var busR = chainR.input;
                var sortedR = n8.slice().sort(function(a, b) { return a.tick - b.tick; });
                var seqR = Promise.resolve(sharedDecoded);
                for (var iR = 0; iR < sortedR.length; iR++) {
                    (function(n) {
                        seqR = seqR.then(function(bufR) {
                            var stR = n.tick / tempoR;
                            var srcR = octxR.createBufferSource();
                            srcR.buffer = bufR;
                            srcR.playbackRate.value = Math.max(0.02, Math.min(8, AudioRender.pitchRate(n.key)));
                            var gR = octxR.createGain();
                            gR.gain.setValueAtTime(0.0001, stR);
                            gR.gain.exponentialRampToValueAtTime(0.7, stR + 0.005);
                            srcR.connect(gR);
                            var pR = octxR.createStereoPanner();
                            pR.pan.value = (n.pan - 50) / 50;
                            gR.connect(pR);
                            pR.connect(busR);
                            srcR.start(stR);
                            srcR.stop(stR + bufR.duration + 0.03);
                            return bufR;
                        });
                    })(sortedR[iR]);
                }
                var rR = await seqR.then(function() { return octxR.startRendering(); });
                var pR2 = computePeak(rR);
                log('[R1] renderSong前奏+H式调度 峰值: ' + pR2.max.toFixed(6) + ' nonzero=' + pR2.nonzero + (pR2.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));
            } catch (e) { log('[R1] ERROR: ' + e.message); }

            // ===== D. 用 buildChain(dry) 播放: 验证效果链本身 =====
            var octxD = new OfflineAudioContext(2, Math.ceil(1.0 * 44100), 44100);
            var chainD = AudioRender.buildChain(octxD, 'dry', octxD.destination);
            var srcD = octxD.createBufferSource();
            srcD.buffer = sharedDecoded;
            srcD.playbackRate.value = 1;
            var gD = octxD.createGain();
            gD.gain.value = 0.7;
            srcD.connect(gD);
            gD.connect(chainD.input);
            srcD.start(0); srcD.stop(0.4);
            var rD = await octxD.startRendering();
            var pD = computePeak(rD);
            log('[D] buildChain(dry) 峰值: ' + pD.max.toFixed(6) + ' nonzero=' + pD.nonzero + (pD.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== E. 模拟 renderSong 的调度 (gain包络 + panner + oversample无关) =====
            var octxE = new OfflineAudioContext(2, Math.ceil(2.3 * 44100), 44100);
            var chainE = AudioRender.buildChain(octxE, 'dry', octxE.destination);
            var srcE = octxE.createBufferSource();
            srcE.buffer = sharedDecoded;
            srcE.playbackRate.value = AudioRender.pitchRate(45);
            var gE = octxE.createGain();
            gE.gain.setValueAtTime(0.0001, 0);
            gE.gain.exponentialRampToValueAtTime(0.7, 0.005);
            srcE.connect(gE);
            gE.connect(chainE.input);
            srcE.start(0); srcE.stop(0.4);
            var rE = await octxE.startRendering();
            var pE = computePeak(rE);
            log('[E] 包络调度峰值: ' + pE.max.toFixed(6) + ' nonzero=' + pE.nonzero + (pE.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== F. 同步方式构建与 renderSong 完全相同的图 (8音符+包络+立体声panner), 无Promise链 =====
            var lenF = Math.ceil(2.3 * 44100);
            var octxF = new OfflineAudioContext(2, lenF, 44100);
            var chainF = AudioRender.buildChain(octxF, 'dry', octxF.destination);
            for (var iF = 0; iF < 8; iF++) {
                var stF = (iF * 5) / 20;
                var srcF = octxF.createBufferSource();
                srcF.buffer = sharedDecoded;
                srcF.playbackRate.value = AudioRender.pitchRate(45 + iF);
                var gF = octxF.createGain();
                gF.gain.setValueAtTime(0.0001, stF);
                gF.gain.exponentialRampToValueAtTime(0.7, stF + 0.005);
                srcF.connect(gF);
                var pannerF = octxF.createStereoPanner();
                pannerF.pan.value = 0;
                gF.connect(pannerF);
                pannerF.connect(chainF.input);
                srcF.start(stF);
                srcF.stop(stF + sharedDecoded.duration + 0.03);
            }
            var rF = await octxF.startRendering();
            var pF = computePeak(rF);
            log('[F] 同步8音符+panner 峰值: ' + pF.max.toFixed(6) + ' nonzero=' + pF.nonzero + (pF.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== G. 同 F 但不使用 panner =====
            var octxG = new OfflineAudioContext(2, lenF, 44100);
            var chainG = AudioRender.buildChain(octxG, 'dry', octxG.destination);
            for (var iG = 0; iG < 8; iG++) {
                var stG = (iG * 5) / 20;
                var srcG = octxG.createBufferSource();
                srcG.buffer = sharedDecoded;
                srcG.playbackRate.value = AudioRender.pitchRate(45 + iG);
                var gG = octxG.createGain();
                gG.gain.setValueAtTime(0.0001, stG);
                gG.gain.exponentialRampToValueAtTime(0.7, stG + 0.005);
                srcG.connect(gG);
                gG.connect(chainG.input);
                srcG.start(stG);
                srcG.stop(stG + sharedDecoded.duration + 0.03);
            }
            var rG = await octxG.startRendering();
            var pG = computePeak(rG);
            log('[G] 同步8音符无panner 峰值: ' + pG.max.toFixed(6) + ' nonzero=' + pG.nonzero + (pG.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== H. 完全复刻 renderSong 的微任务链结构 (每次迭代包在 resolved Promise.then 里) =====
            var lenH = Math.ceil(2.3 * 44100);
            var octxH = new OfflineAudioContext(2, lenH, 44100);
            var chainH = AudioRender.buildChain(octxH, 'dry', octxH.destination);
            var seqH = Promise.resolve(sharedDecoded);
            for (var iH = 0; iH < 8; iH++) {
                (function(ii) {
                    seqH = seqH.then(function(bufferP2) {
                        var st2 = (ii * 5) / 20;
                        var src2 = octxH.createBufferSource();
                        src2.buffer = bufferP2;
                        src2.playbackRate.value = Math.max(0.02, Math.min(8, AudioRender.pitchRate(45 + ii)));
                        var g2 = octxH.createGain();
                        g2.gain.setValueAtTime(0.0001, st2);
                        g2.gain.exponentialRampToValueAtTime(Math.max(0.001, 0.7), st2 + 0.005);
                        src2.connect(g2);
                        var p2 = octxH.createStereoPanner();
                        p2.pan.value = 0;
                        g2.connect(p2);
                        p2.connect(chainH.input);
                        src2.start(st2);
                        src2.stop(st2 + bufferP2.duration + 0.03);
                        return bufferP2;
                    });
                })(iH);
            }
            var rH = await seqH.then(function() { return octxH.startRendering(); });
            var pH = computePeak(rH);
            log('[H] 微任务链8音符+panner 峰值: ' + pH.max.toFixed(6) + ' nonzero=' + pH.nonzero + (pH.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== I. 微任务链但不使用 panner =====
            var octxI = new OfflineAudioContext(2, lenH, 44100);
            var chainI = AudioRender.buildChain(octxI, 'dry', octxI.destination);
            var seqI = Promise.resolve(sharedDecoded);
            for (var iI = 0; iI < 8; iI++) {
                (function(ii) {
                    seqI = seqI.then(function(bufferP3) {
                        var st3 = (ii * 5) / 20;
                        var src3 = octxI.createBufferSource();
                        src3.buffer = bufferP3;
                        src3.playbackRate.value = Math.max(0.02, Math.min(8, AudioRender.pitchRate(45 + ii)));
                        var g3 = octxI.createGain();
                        g3.gain.setValueAtTime(0.0001, st3);
                        g3.gain.exponentialRampToValueAtTime(Math.max(0.001, 0.7), st3 + 0.005);
                        src3.connect(g3);
                        g3.connect(chainI.input);
                        src3.start(st3);
                        src3.stop(st3 + bufferP3.duration + 0.03);
                        return bufferP3;
                    });
                })(iI);
            }
            var rI = await seqI.then(function() { return octxI.startRendering(); });
            var pI = computePeak(rI);
            log('[I] 微任务链8音符无panner 峰值: ' + pI.max.toFixed(6) + ' nonzero=' + pI.nonzero + (pI.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== K. 微任务链构建, 但 startRendering 放到 setTimeout 宏任务里 =====
            var octxK = new OfflineAudioContext(2, lenH, 44100);
            var chainK = AudioRender.buildChain(octxK, 'dry', octxK.destination);
            var seqK = Promise.resolve(sharedDecoded);
            for (var iK = 0; iK < 8; iK++) {
                (function(ii) {
                    seqK = seqK.then(function(bufferP4) {
                        var st4 = (ii * 5) / 20;
                        var src4 = octxK.createBufferSource();
                        src4.buffer = bufferP4;
                        src4.playbackRate.value = Math.max(0.02, Math.min(8, AudioRender.pitchRate(45 + ii)));
                        var g4 = octxK.createGain();
                        g4.gain.setValueAtTime(0.0001, st4);
                        g4.gain.exponentialRampToValueAtTime(Math.max(0.001, 0.7), st4 + 0.005);
                        src4.connect(g4);
                        g4.connect(chainK.input);
                        src4.start(st4);
                        src4.stop(st4 + bufferP4.duration + 0.03);
                        return bufferP4;
                    });
                })(iK);
            }
            var rK = await new Promise(function(okK) {
                seqK.then(function() {
                    setTimeout(function() { okK(octxK.startRendering()); }, 0);
                });
            });
            var pK = computePeak(rK);
            log('[K] 微任务链构建+宏任务startRendering 峰值: ' + pK.max.toFixed(6) + ' nonzero=' + pK.nonzero + (pK.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== L. H结构 + renderSong独有的"废弃probe OfflineAudioContext" =====
            var lenL = Math.ceil(2.3 * 44100);
            var probeCtxL = new OfflineAudioContext(1, 1, 44100);   // 永不渲染的废弃 OAC
            var srL = probeCtxL.sampleRate;
            var octxL = new OfflineAudioContext(2, Math.max(1, Math.ceil(2.3 * srL)), srL);
            var chainL = AudioRender.buildChain(octxL, 'dry', octxL.destination);
            var seqL = Promise.resolve(sharedDecoded);
            for (var iL = 0; iL < 8; iL++) {
                (function(ii) {
                    seqL = seqL.then(function(bufferP5) {
                        var st5 = (ii * 5) / 20;
                        var src5 = octxL.createBufferSource();
                        src5.buffer = bufferP5;
                        src5.playbackRate.value = Math.max(0.02, Math.min(8, AudioRender.pitchRate(45 + ii)));
                        var g5 = octxL.createGain();
                        g5.gain.setValueAtTime(0.0001, st5);
                        g5.gain.exponentialRampToValueAtTime(Math.max(0.001, 0.7), st5 + 0.005);
                        src5.connect(g5);
                        var p5 = octxL.createStereoPanner();
                        p5.pan.value = 0;
                        g5.connect(p5);
                        p5.connect(chainL.input);
                        src5.start(st5);
                        src5.stop(st5 + bufferP5.duration + 0.03);
                        return bufferP5;
                    });
                })(iL);
            }
            var rL = await seqL.then(function() { return octxL.startRendering(); });
            var pL = computePeak(rL);
            log('[L] +废弃probe OAC 峰值: ' + pL.max.toFixed(6) + ' nonzero=' + pL.nonzero + (pL.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== M. H结构 + renderSong独有"新建真实 AudioContext" =====
            try { var extraACm = new AudioContext(); log('[M] 新建 AudioContext state=' + extraACm.state); } catch (e) { log('[M] AudioContext 创建失败: ' + e.message); }
            var octxM = new OfflineAudioContext(2, Math.ceil(2.3 * 44100), 44100);
            var chainM = AudioRender.buildChain(octxM, 'dry', octxM.destination);
            var seqM = Promise.resolve(sharedDecoded);
            for (var iM = 0; iM < 8; iM++) {
                (function(ii) {
                    seqM = seqM.then(function(bufferP6) {
                        var st6 = (ii * 5) / 20;
                        var src6 = octxM.createBufferSource();
                        src6.buffer = bufferP6;
                        src6.playbackRate.value = Math.max(0.02, Math.min(8, AudioRender.pitchRate(45 + ii)));
                        var g6 = octxM.createGain();
                        g6.gain.setValueAtTime(0.0001, st6);
                        g6.gain.exponentialRampToValueAtTime(Math.max(0.001, 0.7), st6 + 0.005);
                        src6.connect(g6);
                        var p6 = octxM.createStereoPanner();
                        p6.pan.value = 0;
                        g6.connect(p6);
                        p6.connect(chainM.input);
                        src6.start(st6);
                        src6.stop(st6 + bufferP6.duration + 0.03);
                        return bufferP6;
                    });
                })(iM);
            }
            var rM = await seqM.then(function() { return octxM.startRendering(); });
            var pM = computePeak(rM);
            log('[M] +新建真实AudioContext 峰值: ' + pM.max.toFixed(6) + ' nonzero=' + pM.nonzero + (pM.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== N1. Promise.all形态: 微任务回调中同步创建8节点 + 同块startRendering =====
            try {
                var lenN = Math.ceil(2.3 * 44100);
                var octxN = new OfflineAudioContext(2, lenN, 44100);
                var chainN = AudioRender.buildChain(octxN, 'dry', octxN.destination);
                var buffsN = [];
                for (var iN = 0; iN < 8; iN++) buffsN.push(Promise.resolve(sharedDecoded));
                var rN = await Promise.all(buffsN).then(function(bs) {
                    for (var jN = 0; jN < 8; jN++) {
                        var stN = (jN * 5) / 20;
                        var srcN = octxN.createBufferSource();
                        srcN.buffer = bs[0];
                        srcN.playbackRate.value = Math.max(0.02, Math.min(8, AudioRender.pitchRate(45 + jN)));
                        var gN = octxN.createGain();
                        gN.gain.setValueAtTime(0.0001, stN);
                        gN.gain.exponentialRampToValueAtTime(Math.max(0.001, 0.7), stN + 0.005);
                        srcN.connect(gN);
                        var pN = octxN.createStereoPanner();
                        pN.pan.value = 0;
                        gN.connect(pN);
                        pN.connect(chainN.input);
                        srcN.start(stN);
                        srcN.stop(stN + bs[0].duration + 0.03);
                    }
                    return octxN.startRendering();
                });
                var pN2 = computePeak(rN);
                log('[N1] Promise.all同块startRendering 峰值: ' + pN2.max.toFixed(6) + ' nonzero=' + pN2.nonzero + (pN2.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));
            } catch (e) { log('[N1] ERROR: ' + e.message); }

            // ===== N2. renderSong + ktv 风格 (EQ+混响+压缩效果链) =====
            window.AudioEngine = {
                getSoundBuffer: function() { return sharedDecoded; },
                getContext: function() { return null; }
            };
            var rN2 = await AudioRender.renderSong({
                notes: notesB, tempo: 20,
                layers: [{ volume: 100, lock: 0 }],
                style: 'ktv', customInstruments: {},
                onProgress: function(l, p) {}
            });
            var pN3 = computePeak(rN2);
            log('[N2] renderSong(ktv风格链) 峰值: ' + pN3.max.toFixed(6) + ' nonzero=' + pN3.nonzero + (pN3.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== N3. renderSong + 自定义音色 (inst>=20) =====
            var notesN3 = [];
            for (var iN3 = 0; iN3 < 8; iN3++) {
                notesN3.push({ tick: iN3 * 5, layer: 0, instrument: 20, key: 45 + iN3, velocity: 100, pan: 50, pitch: 0 });
            }
            var rN3b = await AudioRender.renderSong({
                notes: notesN3, tempo: 20,
                layers: [{ volume: 100, lock: 0 }],
                style: 'dry',
                customInstruments: { 20: { buffer: sharedDecoded, baseKey: 33, gain: 100 } },
                onProgress: function(l, p) {}
            });
            var pN4 = computePeak(rN3b);
            log('[N3] renderSong(自定义音色) 峰值: ' + pN4.max.toFixed(6) + ' nonzero=' + pN4.nonzero + (pN4.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== N4. 高音区 key=85~87 (rate>8) 不被 clamp, 与实时引擎一致 =====
            var notesN4 = [];
            for (var iN4 = 0; iN4 < 6; iN4++) {
                notesN4.push({ tick: iN4 * 5, layer: 0, instrument: 0, key: 82 + iN4, velocity: 100, pan: 50, pitch: 0 });
            }
            var ratesN4 = [];
            for (var iN4b = 0; iN4b < notesN4.length; iN4b++) {
                ratesN4.push(AudioRender.pitchRate(notesN4[iN4b].key).toFixed(3));
            }
            var rN4 = await AudioRender.renderSong({
                notes: notesN4, tempo: 20,
                layers: [{ volume: 100, lock: 0 }],
                style: 'dry', customInstruments: {},
                onProgress: function(l, p) {}
            });
            var pN5 = computePeak(rN4);
            log('[N4] renderSong(高音key82-87, rate=' + ratesN4.join('/') + ') 峰值: ' + pN5.max.toFixed(6) + ' nonzero=' + pN5.nonzero + (pN5.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== N5. JS 预混路径 (useJsMix): 高密度音符 + 自定义音色 + ktv 效果链 =====
            var notesN5 = [];
            for (var iN5 = 0; iN5 < 1200; iN5++) {
                notesN5.push({ tick: Math.floor(Math.random() * 1200), layer: Math.floor(Math.random() * 3),
                    instrument: Math.floor(Math.random() * 20), key: 25 + Math.floor(Math.random() * 50),
                    velocity: 100, pan: Math.floor(Math.random() * 101), pitch: 0 });
            }
            notesN5.push({ tick: 20, layer: 0, instrument: 20, key: 45, velocity: 100, pan: 50, pitch: 0 });
            notesN5.push({ tick: 40, layer: 1, instrument: 20, key: 52, velocity: 100, pan: 50, pitch: 0 });
            var tN5 = performance.now();
            var rN5 = await AudioRender.renderSong({
                notes: notesN5, tempo: 20,
                layers: [{ volume: 100, lock: 0 }, { volume: 100, lock: 0 }, { volume: 100, lock: 0 }],
                style: 'ktv',
                customInstruments: { 20: { buffer: sharedDecoded, baseKey: 33, gain: 100 } },
                useJsMix: true,
                onProgress: function(l, p) {}
            });
            var pN6 = computePeak(rN5);
            var costN5 = (performance.now() - tN5).toFixed(0);
            log('[N5] renderSong(JS混音/1202音符/ktv/自定义音色) 耗时=' + costN5 + 'ms 峰值: ' + pN6.max.toFixed(6) + ' nonzero=' + pN6.nonzero + (pN6.max > 0.001 ? ' <b>有声</b>' : ' <b style="color:red">静音</b>'));

            // ===== N6. JS 混音取消支持 =====
            var cancelFlag = { v: false };
            var n6done = false;
            try {
                await AudioRender.renderSong({
                    notes: notesN5, tempo: 20,
                    layers: [{ volume: 100, lock: 0 }],
                    style: 'dry', customInstruments: { 20: { buffer: sharedDecoded, baseKey: 33, gain: 100 } },
                    useJsMix: true,
                    cancelled: function() { return cancelFlag.v; },
                    onProgress: function(p, label) {
                        if (p >= 5 && !cancelFlag.v) cancelFlag.v = true; // 首次进度回调后取消
                    }
                });
                n6done = true;
            } catch (e6) {
                log('[N6] JS混音取消: ' + (e6 && e6.cancelled ? '<b>已取消(预期)</b>' : '错误: ' + (e6 && e6.message)));
            }
            if (n6done) log('[N6] JS混音取消: <b style="color:red">未取消! (bug)</b>');

            log('TESTS DONE');
        } catch (e) {
            log('<b style="color:red">ERROR: ' + e.stack + '</b>');
        }
    }
    run();
})();
</script>
