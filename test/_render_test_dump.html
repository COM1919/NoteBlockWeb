<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Render Test</title></head>
<body>
<div id="result">RUNNING...<br>harp.ogg HTTP: 200<br>decoded duration: 0.560s, channels=1</div>
<script src="/static/js/audio_render.js?v=20260906a"></script>
<script>
(function() {
    'use strict';
    // Mock AudioEngine: 与真实环境一致 (getSoundBuffer 返回 null 时走 getDefaultBuffer)
    window.AudioEngine = {
        getSoundBuffer: function() { return null; },
        getContext: function() { return null; }
    };
    var out = document.getElementById('result');
    function log(s) { out.innerHTML += '<br>' + s; }

    function computePeak(buf) {
        var ch = buf.getChannelData(0);
        var max = 0, sum = 0, nonzero = 0;
        for (var i = 0; i < ch.length; i++) {
            var v = Math.abs(ch[i]);
            if (v > max) max = v;
            sum += v;
            if (v > 0.0001) nonzero++;
        }
        return { max: max, avg: sum / ch.length, nonzero: nonzero, len: ch.length, dur: buf.duration };
    }

    async function run() {
        try {
            // 1) 解码一个真实音色
            var resp = await fetch('/static/sounds/harp.ogg');
            log('harp.ogg HTTP: ' + resp.status);
            var ab = await resp.arrayBuffer();
            // Chrome 87+: OfflineAudioContext.decodeAudioData 已移除, 用 AudioContext
            var dctx = new AudioContext();
            var buffer = await new Promise(function(ok, no) { dctx.decodeAudioData(ab, ok, no); });
            log('decoded duration: ' + buffer.duration.toFixed(3) + 's, channels=' + buffer.numberOfChannels);

            // 2) 渲染一段 8 音符旋律 (C4~)
            var notes = [];
            for (var i = 0; i < 8; i++) {
                notes.push({ tick: i * 5, layer: 0, instrument: 0, key: 45 + i, velocity: 100, pan: 50, pitch: 0 });
            }
            var vuv = await AudioRender.renderSong({
                notes: notes,
                tempo: 20,
                layers: [{ volume: 100, lock: 0 }],
                style: 'dry',
                customInstruments: {},
                onProgress: function(l, p) { log('progress: ' + (l || '') + ' ' + p); }
            }).catch(function(e) { throw new Error('renderSong failed: ' + (e && e.message || e)); });
            var peak = computePeak(vuv);
            log('=== RESULT ===');
            log('duration=' + peak.dur.toFixed(2) + 's len=' + peak.len);
            log('peak=' + peak.max.toFixed(6) + ' avg=' + peak.avg.toFixed(8) + ' nonzero=' + peak.nonzero);
            if (peak.max < 0.001) {
                log('VERDICT: <b style="color:red">SILENT (peak near zero)</b>');
            } else {
                log('VERDICT: <b style="color:green">HAS AUDIO</b>');
            }
            // 3) 同时测 WAV 编码
            var wav = AudioRender.encodeWav(rendered);
            log('WAV size: ' + wav.size + ' bytes');
        } catch (e) {
            log('<b style="color:red">ERROR: ' + (e && e.stack || e) + '</b>');
        }
    }
    run();
})();
</script>

</body></html>
